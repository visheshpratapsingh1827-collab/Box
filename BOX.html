<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Layout Example</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      margin: 50px;
    }

    .box {
      border: 5px solid black;
      width: 200px;
      height: 200px;
    }

    .text-box {
      background-color: teal;
      color: black;
      padding: 20px;
      border: 5px solid black;
      width: 300px;
    }

    .yellow-box {
      background-color: yellow;
      border: 20px solid black;
      width: 200px;
      height: 200px;
    }

    .red-box {
      background-color: indianred;
      border: 10px solid black;
      width: 200px;
      height: 200px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 40px;
    }

    .middle {
      margin-left: 150px;
    }

    .bottom {
      margin-left: 300px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="text-box">
      <p>
       Vishesh Pratap Singh 
       CSIT 
       kiet deemed to be university
      </p>
    </div>

    <div class="yellow-box middle"></div>
    
    <div class="red-box bottom"></div>
  </div>
</body>
</html>
